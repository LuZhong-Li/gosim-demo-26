<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spreadsheet Data Workspace</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #202124; background: #fff; }
    body { margin: 0; }
    header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #dadce0; }
    main { padding: 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e0e0e0; min-width: 90px; height: 26px; padding: 2px 6px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .tabs span { padding: 6px 12px; border: 1px solid #dadce0; border-radius: 4px; cursor: pointer; }
    .tabs span.active { background: #e8f0fe; }
    .formula { width: 100%; padding: 6px 8px; margin-bottom: 8px; }
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>
  <div id="homeView" class="view active">
    <main>
      <h1>Workbooks</h1>
      <button id="newWorkbook">New workbook</button>
      <div id="workbookList"></div>
    </main>
  </div>
  <div id="editorView" class="view">
    <header>
      <strong>Sheets</strong>
      <input id="workbookName" type="text" aria-label="Workbook name" />
      <button id="importCsv">Import CSV</button>
      <button id="exportCsv">Export CSV</button>
      <button id="backHome">Home</button>
    </header>
    <main>
      <div class="toolbar">
        <button id="addSheet">Add sheet</button>
        <button id="renameSheet">Rename sheet</button>
        <button id="deleteSheet">Delete sheet</button>
        <button id="insertRow">Insert row</button>
        <button id="deleteRow">Delete row</button>
        <button id="insertCol">Insert column</button>
        <button id="deleteCol">Delete column</button>
      </div>
      <input id="formulaBar" class="formula" aria-label="Formula bar" placeholder="Cell value or formula, e.g. =SUM(A1:A3)" />
      <table id="grid" aria-label="Grid"></table>
      <div id="tabs" class="tabs"></div>
    </main>
  </div>
  <script>
    const KEY = 'sheet_workspace_v1';
    let state = load();
    let activeCell = null;

    function seed() {
      return {
        workbooks: [{
          id: 1,
          name: 'Untitled workbook',
          active: 0,
          sheets: [{ name: 'Sheet1', rows: 20, cols: 10, cells: {} }],
        }],
        current: 1,
      };
    }
    function load() {
      try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
      const s = seed(); save(s); return s;
    }
    function save(s) { localStorage.setItem(KEY, JSON.stringify(s || state)); }
    function current() { return state.workbooks.find(w => w.id === state.current); }
    function sheet() { const w = current(); return w.sheets[w.active]; }
    function cellKey(r, c) { return colName(c) + (r + 1); }
    function colName(c) { let s = ''; c++; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); } return s; }
    function parseRef(ref) { const m = /^([A-Z]+)([0-9]+)$/.exec(ref.toUpperCase()); if (!m) return null; let c = 0; for (const ch of m[1]) c = c * 26 + (ch.charCodeAt(0) - 64); return { r: parseInt(m[2], 10) - 1, c: c - 1 }; }
    function evalCell(s, r, c, seen) {
      const key = cellKey(r, c); if (!s.cells[key]) return '';
      const v = s.cells[key].value || '';
      if (!v.startsWith('=')) return v;
      if (seen.has(key)) return '#CYCLE!';
      seen.add(key);
      const expr = v.slice(1).trim();
      const agg = /^(SUM|AVG|COUNT|MIN|MAX)\(([A-Z0-9]+:[A-Z0-9]+)\)$/.exec(expr);
      if (agg) {
        const nums = rangeValues(s, agg[2]);
        if (!nums.length) return 0;
        if (agg[1] === 'SUM') return nums.reduce((a, b) => a + b, 0);
        if (agg[1] === 'AVG') return nums.reduce((a, b) => a + b, 0) / nums.length;
        if (agg[1] === 'COUNT') return nums.length;
        if (agg[1] === 'MIN') return Math.min(...nums);
        if (agg[1] === 'MAX') return Math.max(...nums);
      }
      const basic = /^=?(SUM|AVG|COUNT|MIN|MAX)\(([A-Z0-9]+:[A-Z0-9]+)\)$/i.exec(expr);
      if (basic) { const nums = rangeValues(s, basic[2]); const f = basic[1].toUpperCase(); if (f === 'SUM') return nums.reduce((a, b) => a + b, 0); if (f === 'AVG') return nums.reduce((a, b) => a + b, 0) / nums.length; if (f === 'COUNT') return nums.length; if (f === 'MIN') return Math.min(...nums); if (f === 'MAX') return Math.max(...nums); }
      try { return Function('return (' + expr.replace(/[A-Z]+[0-9]+/g, ref => { const p = parseRef(ref); return p ? JSON.stringify(Number(evalCell(s, p.r, p.c, seen))) : ref; }) + ')')(); } catch (e) { return '#ERROR!'; }
    }
    function rangeValues(s, range) {
      const [a, b] = range.split(':').map(parseRef); if (!a || !b) return [];
      const nums = [];
      for (let r = Math.min(a.r, b.r); r <= Math.max(a.r, b.r); r++) for (let c = Math.min(a.c, b.c); c <= Math.max(a.c, b.c); c++) {
        const v = parseFloat(evalCell(s, r, c, new Set()));
        if (!isNaN(v)) nums.push(v);
      }
      return nums;
    }
    function render() {
      document.getElementById('homeView').classList.toggle('active', !state.current);
      document.getElementById('editorView').classList.toggle('active', !!state.current);
      const list = document.getElementById('workbookList');
      list.innerHTML = state.workbooks.map(w => `<div><button data-open="${w.id}">${escapeHtml(w.name)}</button> <button data-rename="${w.id}">Rename</button></div>`).join('');
      if (!state.current) return;
      const w = current(); const s = sheet();
      document.getElementById('workbookName').value = w.name;
      const grid = document.getElementById('grid');
      let html = '<thead><tr><th></th>' + Array.from({ length: s.cols }, (_, c) => `<th>${colName(c)}</th>`).join('') + '</tr></thead><tbody>';
      for (let r = 0; r < s.rows; r++) {
        html += '<tr><th>' + (r + 1) + '</th>';
        for (let c = 0; c < s.cols; c++) {
          const key = cellKey(r, c); const cell = s.cells[key] || {}; const shown = evalCell(s, r, c, new Set());
          html += `<td data-r="${r}" data-c="${c}">${escapeHtml(shown)}</td>`;
        }
        html += '</tr>';
      }
      grid.innerHTML = html + '</tbody>';
      document.getElementById('tabs').innerHTML = w.sheets.map((sh, i) => `<span class="${i === w.active ? 'active' : ''}" data-sheet="${i}">${escapeHtml(sh.name)}</span>`).join('');
    }
    function escapeHtml(x) { return String(x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    document.getElementById('newWorkbook').addEventListener('click', () => { const id = Math.max(0, ...state.workbooks.map(w => w.id)) + 1; state.workbooks.push({ id, name: 'Untitled workbook', active: 0, sheets: [{ name: 'Sheet1', rows: 20, cols: 10, cells: {} }] }); state.current = id; save(); render(); });
    document.getElementById('workbookList').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const id = Number(b.dataset.open || b.dataset.rename); if (b.dataset.open) { state.current = id; save(); render(); } else if (b.dataset.rename) { const w = state.workbooks.find(x => x.id === id); const n = prompt('Rename workbook', w.name); if (n) { w.name = n; save(); render(); } } });
    document.getElementById('backHome').addEventListener('click', () => { state.current = null; save(); render(); });
    document.getElementById('addSheet').addEventListener('click', () => { const w = current(); w.sheets.push({ name: 'Sheet' + (w.sheets.length + 1), rows: 20, cols: 10, cells: {} }); w.active = w.sheets.length - 1; save(); render(); });
    document.getElementById('renameSheet').addEventListener('click', () => { const w = current(); const sh = sheet(); const n = prompt('Rename sheet', sh.name); if (n) { sh.name = n; save(); render(); } });
    document.getElementById('deleteSheet').addEventListener('click', () => { const w = current(); if (w.sheets.length > 1) { w.sheets.splice(w.active, 1); w.active = Math.max(0, w.active - 1); save(); render(); } });
    document.getElementById('insertRow').addEventListener('click', () => { const s = sheet(); s.rows++; save(); render(); });
    document.getElementById('deleteRow').addEventListener('click', () => { const s = sheet(); if (s.rows > 1) s.rows--; save(); render(); });
    document.getElementById('insertCol').addEventListener('click', () => { const s = sheet(); s.cols++; save(); render(); });
    document.getElementById('deleteCol').addEventListener('click', () => { const s = sheet(); if (s.cols > 1) s.cols--; save(); render(); });
    document.getElementById('tabs').addEventListener('click', e => { const span = e.target.closest('span'); if (!span) return; current().active = Number(span.dataset.sheet); save(); render(); });
    document.getElementById('grid').addEventListener('click', e => { const td = e.target.closest('td'); if (!td) return; activeCell = td; const s = sheet(); const key = cellKey(Number(td.dataset.r), Number(td.dataset.c)); const cell = s.cells[key]; document.getElementById('formulaBar').value = cell ? (cell.value || '') : ''; });
    document.getElementById('formulaBar').addEventListener('change', e => { if (!activeCell) return; const s = sheet(); const key = cellKey(Number(activeCell.dataset.r), Number(activeCell.dataset.c)); s.cells[key] = { value: e.target.value }; save(); render(); });
    document.getElementById('exportCsv').addEventListener('click', () => { const s = sheet(); let csv = ''; for (let r = 0; r < s.rows; r++) { const row = []; for (let c = 0; c < s.cols; c++) row.push(String(evalCell(s, r, c, new Set())).replace(/"/g, '""')); csv += row.join(',') + '\n'; } const blob = new Blob([csv], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = sheet().name + '.csv'; a.click(); });
    document.getElementById('importCsv').addEventListener('click', () => { const input = document.createElement('input'); input.type = 'file'; input.accept = '.csv'; input.onchange = () => { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = () => { const w = current(); const sh = sheet(); const rows = String(reader.result).split(/\r?\n/).filter(Boolean); sh.rows = rows.length; sh.cols = Math.max(...rows.map(r => r.split(',').length), 1); sh.cells = {}; rows.forEach((line, r) => line.split(',').forEach((v, c) => { if (v !== '') sh.cells[cellKey(r, c)] = { value: v }; })); save(); render(); }; reader.readAsText(file); }; input.click(); });
    render();
  </script>
</body>
</html>
