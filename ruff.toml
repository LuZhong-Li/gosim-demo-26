line-length = 100
target-version = "py311"
extend-exclude = [
    "demo/output",
    ".venv*",
    "*.xlsx",
    "demo/run_demo.py",
    "demo/init_seed.py",
    # The arcbench competition workspace is self-contained and not part of the
    # root Python package; it includes vendored upstream reference repos.
    "arcbench",
]

[lint]
select = ["E", "F", "I", "UP"]

[lint.per-file-ignores]
"agent/mock_nl_parser.py" = ["E402"]
"demo/init_seed.py" = ["E402"]
"demo/run_demo.py" = ["E402"]
"tools/debug_helper.py" = ["E402"]
"web/server.py" = ["E402"]
"web/run.py" = ["E402"]
