[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-sheet"
version = "0.1.0"
description = "GX-Sheet：基于电子表格模拟 GitHub 组织管控与自动化 Agent 原型"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "click==8.1.8",
    "typer==0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "ruff>=0.12,<0.13",
    "pytest-cov>=6,<7",
]
llm = [
    "openai>=1.99,<2",
]

[project.scripts]
gx = "gx.api.cli:cli"

[tool.setuptools]
py-modules = ["constants", "config", "errors"]

[tool.setuptools.packages.find]
where = ["src"]
